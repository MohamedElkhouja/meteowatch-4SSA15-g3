server.port=8081

spring.application.name=station-service

# Le Config Server est optionnel : le service demarre meme s'il est absent.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/station_db
spring.datasource.username=${DB_USER:meteo}
spring.datasource.password=${DB_PASSWORD:meteo}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info